<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>책취향탐험대</title>
<style>
:root{--c:#5b5bd6;--bg:#f4f1ff}
*{box-sizing:border-box}body{margin:0;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:#222}
.app{max-width:560px;margin:0 auto;padding:20px;min-height:100vh}
h1{font-size:28px;margin:8px 0}h2{font-size:22px}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 4px 16px #5b5bd622;margin:14px 0}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--c);color:#fff;border:0;border-radius:14px;padding:14px 20px;font-size:17px;font-weight:700;width:100%;margin-top:10px}
.btn.sub{background:#e8e6ff;color:var(--c)}
.opt{display:block;width:100%;text-align:left;background:#f7f6ff;border:2px solid #e2dfff;border-radius:14px;padding:14px;margin:8px 0;font-size:16px}
.opt:hover{border-color:var(--c)}
.bar{height:10px;background:#e2dfff;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c);transition:.3s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid #d8d4ff;background:#fff;border-radius:20px;padding:8px 14px;font-size:15px}.chip.on{background:var(--c);color:#fff;border-color:var(--c)}
.big{font-size:72px;text-align:center}.center{text-align:center}
.book{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}
.cover{overflow:hidden;font-size:38px;width:64px;height:84px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;background:linear-gradient(135deg,#e8e6ff,#ffe9f2)}
.tag{display:inline-block;font-size:12px;background:#eee;border-radius:10px;padding:2px 8px;margin:2px 2px 0 0}
.why{font-size:13px;color:#5b5bd6;margin-top:4px}
a.go{font-size:13px;color:var(--c);font-weight:700;text-decoration:none;cursor:pointer}
.sw{display:flex;gap:8px}.sw .btn{margin-top:14px;font-size:15px;padding:14px 6px}
img.cv{width:100%;height:100%;object-fit:cover}.intro{font-size:13px;color:#555;margin:6px 0}
@media print{.btn,.sw,.chips,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}
input.nm{font-family:inherit;font-size:16px;padding:10px;border:2px solid #d8d4ff;border-radius:10px;width:100%}
.trk{position:relative;padding-top:22px;margin-top:4px}.walker{position:absolute;top:0;font-size:22px;transition:left .4s}.goal{position:absolute;right:-2px;top:0;font-size:22px}
.scene{font-size:58px;text-align:center;letter-spacing:6px;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.sceneimg{display:block;width:100%;max-width:520px;margin:0 auto 6px;border-radius:16px;background:#ece9ff}
.qt{text-align:center;font-size:23px;line-height:1.4;margin:8px 0 14px}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.optc{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;background:#f7f6ff;border:2px solid #e2dfff;border-radius:16px;padding:14px 8px;font-family:inherit;cursor:pointer;min-height:120px;transition:.15s}
.optc:hover,.optc:active{border-color:var(--c);transform:scale(1.03);background:#eeecff}
.oi{font-size:42px;line-height:1}.ot{font-size:15px;line-height:1.35;text-align:center;word-break:keep-all}
.big{animation:pop .6s ease-out}@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.charimg{border-radius:24px;background:#fff;object-fit:cover;max-width:100%}
label{font-weight:700;display:block;margin-top:14px}
small{color:#777}

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

function fmt(b){if(/^Why\?/.test(b.t)||/만화|툰/.test(b.t+b.intro))return 'comic';if(b.g<=2&&b.p&&b.p<=60)return 'picture';if(b.ty==='K')return 'info';return 'story'}
function topTags(n){return Object.keys(S.tagw).filter(k=>S.tagw[k]>0).sort((a,b)=>S.tagw[b]-S.tagw[a]).slice(0,n)}
function quiz(){preloadNext();const [q,o]=Q[S.q];const pct=Math.round(S.q/Q.length*100);
 $.innerHTML='<div class="trk"><div class="bar"><i style="width:'+pct+'%"></i></div><span class="walker" style="left:calc('+pct+'% - 4px)">🧭</span><span class="goal">🏆</span></div><small>미션 '+(S.q+1)+' / '+Q.length+'</small><div class="card"><img class="sceneimg" src="'+SCENEIMG[S.q]+'" alt="'+SCENES[S.q]+'"><h2 class="qt">'+q+'</h2><div class="ogrid">'+o.map((x,i)=>'<button class="optc" onclick="pick('+i+')"><span class="oi">'+ICONS[S.q][i]+'</span><span class="ot">'+x[0]+'</span></button>').join('')+'</div></div>'}
function pick(i){const o=Q[S.q][1][i];(QT[S.q][i]||[]).forEach(t=>S.tagw[t]=(S.tagw[t]||0)+1);if(S.q===14)S.fmt=FMTQ[i];for(const k in o[1])S.ty[k]+=o[1][k];for(const k in o[2])S.mo[k]+=o[2][k];S.q++;S.q<Q.length?quiz():result()}
function result(){const t=topType(),T=TYPES[t];const sorted=Object.keys(S.ty).sort((a,b)=>S.ty[b]-S.ty[a]);const sec=TYPES[sorted[1]];const tg=topTags(3);
 $.innerHTML='<div class="card center" style="border:4px solid var(--c)"><small>나의 독서 캐릭터 카드</small><div class="big">'+charImg(t,230)+'</div><h1>'+T.n+'</h1><p>'+T.d+'</p>'+(tg.length?'<p><b>취향 키워드</b><br>'+tg.map(x=>'<span class="tag" style="background:#e8e6ff;color:#5b5bd6;font-size:14px;padding:4px 10px">#'+x+'</span>').join(' ')+'</p>':'')+'<p><small>두 번째 성향: '+sec.e+' '+sec.n+'</small></p></div><button class="btn" onclick="setup()">내게 맞는 책 찾기</button><button class="btn sub" onclick="home()">다시 하기</button>'}
function chips(list,cur,fn,multi){return '<div class="chips">'+list.map(x=>{const v=Array.isArray(x)?x[1]:x,l=Array.isArray(x)?x[0]:x;const on=multi?cur.includes(v):cur===v;return '<button class="chip '+(on?'on':'')+'" onclick="'+fn+'(\''+v+'\')">'+l+'</button>'}).join('')+'</div>'}
function setup(){$.innerHTML='<h2>조건을 알려 주세요</h2><div class="card"><label>학년</label>'+chips(GRADES,S.grade,'sg')+'<label>읽기 난이도</label>'+chips(LEVELS,S.level,'sl')+'<label>다 읽는 데 걸리는 시간</label>'+chips(TIMES,S.time,'st')+'<label>관심사 (여러 개 선택)</label>'+chips(INTS,S.ints,'si',true)+'</div><button class="btn" onclick="recs()">추천 받기</button>'}
function sg(v){S.grade=+v;setup()}function sl(v){S.level=+v;setup()}function st(v){S.time=+v;setup()}
function si(v){S.ints.includes(v)?S.ints=S.ints.filter(x=>x!=v):S.ints.push(v);setup()}
function score(b){const eff=Math.min(4,Math.max(1,S.grade+S.level));let s=0;
 const maxT=Math.max(...Object.values(S.ty),1),maxM=Math.max(...Object.values(S.mo),1);
 s+=(S.ty[b.ty]/maxT)*5+(S.mo[b.m]/maxM)*3;
 const bi=b.i.filter(x=>S.ints.includes(x)).length;s+=bi*5;const mt=Math.max(...Object.values(S.tagw),1);let ts=0;b.i.forEach(t=>ts+=(S.tagw[t]||0)/mt);s+=Math.min(ts,2.5)*2.2;const f0=fmt(b);if(S.fmt==='visual'&&(f0==='picture'||f0==='comic'))s+=3;else if(S.fmt==='short'&&b.min<=25)s+=3;else if(S.fmt==='long'&&b.min>60)s+=3;else if(S.fmt==='info'&&f0==='info')s+=3;
 s-=Math.abs(b.g-eff)*3.5; if(b.g>S.grade+1||b.g<S.grade-1)s-=6;
 if(S.time<999){if(b.min<=S.time)s+=3;else s-=3+(b.min-S.time)/5}
 // 게임 학습
 if(S.likes.length+S.passes.length){const ad=(arr,w)=>arr.forEach(x=>{if(x.ty==b.ty)s+=w;if(x.m==b.m)s+=w*.7;x.i.forEach(i=>{if(b.i.includes(i))s+=w*.5})});ad(S.likes,.8);ad(S.later,.3);ad(S.passes,-.8)}
 return s}
function why(b){const r=[];r.push(TYPES[b.ty].e+' '+TYPES[b.ty].n+' 취향');const tags=[...new Set(S.ints.concat(topTags(3)))];const m=b.i.filter(x=>tags.includes(x));if(m.length)r.push('취향 키워드: '+m.slice(0,3).join('·'));if(S.time<999&&b.min<=S.time)r.push(S.time+'분 안에 읽기 가능');return r.join(' / ')}
function cov(b){return b.c?'<img class="cv" referrerpolicy="no-referrer" src="'+b.c+'" alt="" onerror="this.replaceWith(document.createTextNode(\''+b.e+'\'))">':b.e}
function bookRow(b,extra){return '<div class="book"><div class="cover">'+cov(b)+'</div><div><b>'+b.t+'</b><br><small>'+b.a+'</small><div class="intro">'+b.intro+'</div><span class="tag">'+MOODS[b.m]+'</span><span class="tag">약 '+b.min+'분</span><span class="tag">'+GRADES[b.g-1][0].split(' ')[0]+'</span>'+(extra?'<div class="why">'+extra+'</div>':'')+'<br><a class="go" onclick="findIt(\''+b.t.replace(/'/g,"")+'\')">채움책방에서 찾기 ›</a></div></div>'}
function findIt(t){navigator.clipboard&&navigator.clipboard.writeText(t);alert('책 제목을 복사했어요! 다채움 > 채움책방에서 "'+t+'"를 검색해 보세요.');}
function recs(){const eff=Math.min(4,Math.max(1,S.grade+S.level));const ranked=BOOKS.map(b=>({b,s:score(b)})).sort((a,b)=>b.s-a.s).map(x=>x.b);
 const sorted=Object.keys(S.ty).sort((a,b)=>S.ty[b]-S.ty[a]);const sec=sorted[1];
 const used=new Set();const take=(arr,n)=>{const out=[];for(const b of arr){if(out.length>=n)break;if(!used.has(b.t)){used.add(b.t);out.push(b)}}return out};
 const g1=take(ranked,3);
 const upG=Math.min(4,eff+1);let chal=take(ranked.filter(b=>S.grade===4?b.min>=Math.max(...g1.map(x=>x.min),60):b.g===upG),2);if(chal.length<2)chal=chal.concat(take(ranked,2-chal.length));
 let diff=take(ranked.filter(b=>b.ty===sec),1);if(!diff.length)diff=take(ranked,1);
 S.last=g1.concat(chal,diff);
 if(!S.counted){S.counted=true;cnt('done');cnt('done-'+dayKey());cnt('grade-'+S.grade);cnt('type-'+topType());sheetLog()}
 const sect=(h,sub,arr)=>'<div class="card"><b>'+h+'</b><div><small>'+sub+'</small></div>'+arr.map(b=>bookRow(b,why(b))).join('')+'</div>';
 const tg=topTags(3);
 $.innerHTML='<div class="center">'+charImg(topType(),110)+'</div><h2 class="center">'+TYPES[topType()].n+'님을 위한 추천</h2>'+(tg.length?'<p class="center"><small>취향 키워드 '+tg.map(x=>'#'+x).join(' ')+'</small></p>':'')
 +sect('🎯 딱 맞는 책','내 취향과 가장 잘 맞아요',g1)+sect('🚀 한 걸음 더, 도전해 볼 책','조금 더 길거나 어려운 책이에요',chal)+sect('🎲 색다른 취향 책','두 번째 성향 '+TYPES[sec].e+' '+TYPES[sec].n+'에서 골랐어요',diff)
 +'<div class="card noprint center"><b>📱 휴대폰으로 가져가기</b><div id="qr" style="width:210px;margin:10px auto"></div><small>휴대폰 카메라로 QR을 찍으면 추천 책 목록이 글로 떠요.<br>결과는 어디에도 저장되지 않아요.</small></div><button class="btn sub" onclick="home()">👋 다음 친구 시작하기</button><button class="btn" onclick="game()">책 고르기 게임으로 더 정교하게!</button><button class="btn sub" onclick="setup()">조건 바꾸기</button><button class="btn sub" onclick="shelf()">내 책장 ('+(S.likes.length+S.later.length)+')</button>';drawQR()}
function drawQR(){const el=document.getElementById('qr');if(!el||!window.qrcode)return;try{qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];const q=qrcode(0,'L');q.addData(qrText(),'Byte');q.make();el.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){el.innerHTML='<small>QR을 만들 수 없어요</small>'}}
function qrText(){const T0=TYPES[topType()];return '[책취향탐험대] '+T0.e+' '+T0.n+'\n'+(S.last||[]).map((b,i)=>(i+1)+'. '+b.t+' ('+b.min+'분)').join('\n')+'\n채움책방에서 제목으로 검색하세요'}
function nextBook(){const eff=Math.min(4,Math.max(1,S.grade+S.level));const pool=BOOKS.filter(b=>!S.seen.includes(b.t)&&Math.abs(b.g-eff)<=1).map(b=>({b,s:score(b)+Math.random()*3})).sort((a,b)=>b.s-a.s);return pool[0]&&pool[0].b}
function line(b){const m={H:'웃음이 빵 터지는',T:'가슴이 두근두근 긴장되는',E:'마음이 따뜻해지는',W:'신기하고 새로운'}[b.m];return m+' 이야기. '+(b.i.length?'#'+b.i.join(' #'):'')}
function game(){const b=nextBook();if(!b||S.seen.length>=20)return shelf(true);S.cur=b;
 $.innerHTML='<h2>책 고르기 게임</h2><small>'+S.seen.length+'권 골랐어요 · 고를수록 추천이 정교해져요</small><div class="card center"><div class="cover" style="width:150px;height:205px;font-size:80px;margin:0 auto">'+cov(b)+'</div><h2>'+b.t+'</h2><small>'+b.a+'</small><p class="intro">'+b.intro+'</p><p><small>'+line(b)+'</small></p><small>약 '+b.min+'분 · '+MOODS[b.m]+'</small></div><div class="sw"><button class="btn" onclick="vote(1)">😍 읽고 싶어요</button><button class="btn sub" onclick="vote(0)">🕐 나중에</button><button class="btn sub" onclick="vote(-1)">🙅 패스</button></div><button class="btn sub" onclick="shelf()">그만하고 결과 보기</button>'}
function vote(v){const b=S.cur;S.seen.push(b.t);(v==1?S.likes:v==0?S.later:S.passes).push(b);game()}
function shelf(done){const l=S.likes.concat(S.later);const rec=BOOKS.filter(b=>!S.seen.includes(b.t)).map(b=>({b,s:score(b)})).sort((a,b)=>b.s-a.s).slice(0,4);
 $.innerHTML='<h2>'+(done?'게임 끝! ':'')+'내 책장</h2><div class="card"><b>읽고 싶어요 / 나중에</b>'+(l.length?l.map(b=>bookRow(b,S.likes.includes(b)?'😍 읽고 싶어요':'🕐 나중에')).join(''):'<p><small>아직 없어요</small></p>')+'</div><div class="card"><b>게임 결과로 더 정교해진 추천</b>'+rec.map(x=>bookRow(x.b,why(x.b))).join('')+'</div><button class="btn" onclick="game()">게임 계속하기</button><button class="btn sub" onclick="home()">처음으로</button>'}
function resText(){const T0=TYPES[topType()];const l=S.last||[];return '📚 책취향탐험대 결과\n'+(S.name?S.name+' 학생의 ':'')+'독서 캐릭터: '+T0.e+' '+T0.n+'\n\n추천 책\n'+l.map((b,i)=>(i+1)+'. '+b.t+(b.a?' ('+b.a+')':'')+' - 약 '+b.min+'분').join('\n')+'\n\n다채움 > 채움책방에서 제목을 검색해 읽어 보세요.'}
function shareText(){const t=resText();const done=()=>alert('복사했어요! 붙여넣기 하면 돼요.');if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fb(t))}else fb(t);function fb(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){prompt('아래 글을 복사하세요',t)}a.remove()}}
function saveImg(){const T0=TYPES[topType()],l=S.last||[];const c=document.createElement('canvas');c.width=900;c.height=560+l.length*70;const x=c.getContext('2d');x.fillStyle='#f4f1ff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.strokeStyle='#5b5bd6';x.lineWidth=6;x.beginPath();x.roundRect(30,30,840,c.height-60,30);x.fill();x.stroke();x.textAlign='center';x.fillStyle='#5b5bd6';x.font='bold 28px sans-serif';x.fillText('책취향탐험대'+(S.name?' · '+S.name:''),450,95);x.font='120px sans-serif';x.fillText(T0.e,450,240);x.fillStyle='#222';x.font='bold 48px sans-serif';x.fillText(T0.n,450,320);x.font='24px sans-serif';x.fillStyle='#555';const words=T0.d;x.fillText(words.length>34?words.slice(0,words.indexOf(' ',28)):words,450,370);x.fillText(words.length>34?words.slice(words.indexOf(' ',28)+1):'',450,402);x.textAlign='left';x.fillStyle='#5b5bd6';x.font='bold 30px sans-serif';x.fillText('나에게 맞는 책',80,470);x.fillStyle='#222';x.font='28px sans-serif';l.forEach((b,i)=>{x.fillText((i+1)+'. '+(b.t.length>24?b.t.slice(0,23)+'…':b.t),80,525+i*70);x.fillStyle='#777';x.font='20px sans-serif';x.fillText('약 '+b.min+'분 · '+(b.a||MOODS[b.m]),110,553+i*70);x.fillStyle='#222';x.font='28px sans-serif'});const a=document.createElement('a');a.download='책취향탐험대_결과.png';a.href=c.toDataURL('image/png');a.click()}
